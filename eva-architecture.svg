<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Segoe Print', 'Comic Sans MS', cursive; background: #fffef5;">
  <!-- Whiteboard background with slight texture -->
  <defs>
    <filter id="sketch" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Title - hand-drawn style -->
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b" filter="url(#sketch)">Eva Chatbot - Kako deluje?</text>
  <path d="M 200 45 Q 450 55 700 45" stroke="#0d9488" stroke-width="2" fill="none" stroke-dasharray="5,3"/>

  <!-- User box - sketchy -->
  <rect x="30" y="180" width="100" height="80" rx="8" fill="#fef3c7" stroke="#1e293b" stroke-width="2" filter="url(#sketch)"/>
  <text x="80" y="210" text-anchor="middle" font-size="24">👤</text>
  <text x="80" y="235" text-anchor="middle" font-size="13" fill="#1e293b">Uporabnik</text>
  <text x="80" y="250" text-anchor="middle" font-size="10" fill="#64748b">"Kdaj je rok?"</text>

  <!-- WhatsApp/Web box -->
  <rect x="180" y="180" width="110" height="80" rx="8" fill="#dcfce7" stroke="#1e293b" stroke-width="2" filter="url(#sketch)"/>
  <text x="235" y="210" text-anchor="middle" font-size="20">💬</text>
  <text x="235" y="232" text-anchor="middle" font-size="12" fill="#1e293b">WhatsApp</text>
  <text x="235" y="248" text-anchor="middle" font-size="12" fill="#1e293b">/ Web Chat</text>

  <!-- Arrow 1 -->
  <path d="M 130 220 L 175 220" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)" filter="url(#sketch)"/>

  <!-- FastAPI WebSocket - main box -->
  <rect x="340" y="150" width="160" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3" filter="url(#sketch)"/>
  <text x="420" y="180" text-anchor="middle" font-size="18">⚡</text>
  <text x="420" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">FastAPI</text>
  <text x="420" y="218" text-anchor="middle" font-size="11" fill="#3b82f6">WebSocket</text>
  <line x1="360" y1="230" x2="480" y2="230" stroke="#93c5fd" stroke-width="1"/>
  <text x="420" y="250" text-anchor="middle" font-size="10" fill="#64748b">instant connection</text>
  <text x="420" y="265" text-anchor="middle" font-size="10" fill="#64748b">typing indicator</text>
  <text x="420" y="280" text-anchor="middle" font-size="10" fill="#64748b">real-time response</text>

  <!-- Arrow 2 -->
  <path d="M 290 220 L 335 220" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)" filter="url(#sketch)"/>

  <!-- RAG System box -->
  <rect x="550" y="80" width="140" height="100" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#sketch)"/>
  <text x="620" y="105" text-anchor="middle" font-size="16">🔍</text>
  <text x="620" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">RAG System</text>
  <text x="620" y="145" text-anchor="middle" font-size="10" fill="#64748b">pgvector search</text>
  <text x="620" y="160" text-anchor="middle" font-size="10" fill="#64748b">relevantni dokumenti</text>
  <text x="620" y="175" text-anchor="middle" font-size="10" fill="#64748b">Supabase DB</text>

  <!-- Arrow to RAG -->
  <path d="M 500 180 Q 520 130 545 130" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowhead)" fill="none" filter="url(#sketch)"/>
  <text x="510" y="140" font-size="9" fill="#7c3aed" transform="rotate(-30 510 140)">query</text>

  <!-- OpenAI box -->
  <rect x="550" y="220" width="140" height="100" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2" filter="url(#sketch)"/>
  <text x="620" y="248" text-anchor="middle" font-size="16">🧠</text>
  <text x="620" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#be185d">OpenAI GPT</text>
  <text x="620" y="288" text-anchor="middle" font-size="10" fill="#64748b">fine-tuned model</text>
  <text x="620" y="303" text-anchor="middle" font-size="10" fill="#64748b">200 SLO primerov</text>

  <!-- Arrow to OpenAI -->
  <path d="M 500 240 L 545 260" stroke="#db2777" stroke-width="2" marker-end="url(#arrowhead)" fill="none" filter="url(#sketch)"/>

  <!-- Arrow from RAG to OpenAI -->
  <path d="M 620 180 L 620 215" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowhead)" filter="url(#sketch)"/>
  <text x="640" y="200" font-size="9" fill="#a855f7">context</text>

  <!-- Redis box -->
  <rect x="340" y="340" width="100" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#sketch)"/>
  <text x="390" y="365" text-anchor="middle" font-size="14">🗄️</text>
  <text x="390" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">Redis</text>
  <text x="390" y="400" text-anchor="middle" font-size="9" fill="#64748b">session cache</text>

  <!-- Arrow to Redis -->
  <path d="M 400 290 L 395 335" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead)" filter="url(#sketch)"/>

  <!-- Response arrow back -->
  <path d="M 340 250 Q 280 280 235 260" stroke="#059669" stroke-width="2" marker-end="url(#arrowhead-green)" fill="none" filter="url(#sketch)"/>
  <text x="285" y="285" font-size="10" fill="#059669">&lt;1s odgovor</text>

  <!-- Slack escalation box -->
  <rect x="740" y="270" width="130" height="80" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" filter="url(#sketch)"/>
  <text x="805" y="300" text-anchor="middle" font-size="18">📢</text>
  <text x="805" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#a16207">Slack Alert</text>
  <text x="805" y="338" text-anchor="middle" font-size="9" fill="#64748b">če confidence &lt;80%</text>
  <text x="805" y="350" text-anchor="middle" font-size="9" fill="#64748b">človeška pomoč</text>

  <!-- Arrow to Slack -->
  <path d="M 690 280 Q 710 290 735 295" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowhead-orange)" stroke-dasharray="5,3" fill="none" filter="url(#sketch)"/>
  <text x="700" y="265" font-size="9" fill="#ea580c">eskalacija</text>

  <!-- Self-learning arrow -->
  <path d="M 805 350 Q 805 420 620 420 Q 500 420 500 320" stroke="#059669" stroke-width="2" marker-end="url(#arrowhead-green)" stroke-dasharray="4,4" fill="none" filter="url(#sketch)"/>
  <text x="650" y="440" font-size="10" fill="#059669">📚 self-learning iz eskalacij</text>

  <!-- Annotations - hand-written style -->
  <text x="50" y="80" font-size="11" fill="#64748b" transform="rotate(-5 50 80)">* vprašanje v slovenščini</text>
  <text x="700" y="120" font-size="11" fill="#64748b" transform="rotate(3 700 120)">* najde relevanten odgovor</text>
  <text x="750" y="220" font-size="11" fill="#64748b" transform="rotate(-2 750 220)">* generira human-like tekst</text>

  <!-- Performance note box -->
  <rect x="30" y="380" width="180" height="100" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" stroke-dasharray="8,4" filter="url(#sketch)"/>
  <text x="120" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">📊 Rezultati:</text>
  <text x="120" y="425" text-anchor="middle" font-size="11" fill="#166534">• odziv: &lt;1 sekunda</text>
  <text x="120" y="445" text-anchor="middle" font-size="11" fill="#166534">• 97% brez eskalacije</text>
  <text x="120" y="465" text-anchor="middle" font-size="11" fill="#166534">• stroški: €5/mesec</text>

  <!-- vs n8n note -->
  <rect x="30" y="290" width="130" height="70" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,2" filter="url(#sketch)"/>
  <text x="95" y="310" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">❌ n8n prej:</text>
  <text x="95" y="325" text-anchor="middle" font-size="9" fill="#b91c1c">3-5s odziv</text>
  <text x="95" y="340" text-anchor="middle" font-size="9" fill="#b91c1c">špageti workflow</text>
  <text x="95" y="355" text-anchor="middle" font-size="9" fill="#b91c1c">ni real-time</text>
</svg>