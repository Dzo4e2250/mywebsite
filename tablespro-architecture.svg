<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200">
  <style>
    .sketch-line { stroke: #374151; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .sketch-box { stroke: #374151; stroke-width: 2.5; fill: #f9fafb; stroke-linecap: round; stroke-linejoin: round; }
    .sketch-box-result { stroke: #0d9488; stroke-width: 3; fill: #f0fdfa; stroke-linecap: round; stroke-linejoin: round; }
    .sketch-text { font-family: 'DM Sans', sans-serif; font-size: 14px; fill: #374151; }
    .sketch-text-big { font-family: 'DM Sans', sans-serif; font-size: 16px; fill: #0d9488; font-weight: 600; }
    .sketch-symbol { font-family: 'DM Sans', sans-serif; font-size: 28px; fill: #6b7280; }
    .sketch-icon { font-size: 24px; }
  </style>

  <!-- Box 1: Nextcloud Tables - sketchy rectangle -->
  <path class="sketch-box" d="M 22 45 Q 20 42, 25 40 L 150 38 Q 158 40, 160 45 L 162 145 Q 160 152, 155 155 L 28 158 Q 20 155, 18 150 Z"/>
  <text x="90" y="75" text-anchor="middle" class="sketch-icon">📊</text>
  <text x="90" y="105" text-anchor="middle" class="sketch-text">Nextcloud</text>
  <text x="90" y="125" text-anchor="middle" class="sketch-text">Tables</text>

  <!-- Plus sign 1 - hand drawn -->
  <path class="sketch-line" d="M 190 95 Q 192 97, 220 96" stroke-width="3"/>
  <path class="sketch-line" d="M 205 78 Q 203 82, 206 115" stroke-width="3"/>

  <!-- Box 2: Deck - sketchy rectangle -->
  <path class="sketch-box" d="M 250 43 Q 248 38, 255 38 L 378 42 Q 385 44, 388 48 L 390 148 Q 388 156, 382 158 L 258 155 Q 248 152, 248 145 Z"/>
  <text x="318" y="75" text-anchor="middle" class="sketch-icon">📋</text>
  <text x="318" y="105" text-anchor="middle" class="sketch-text">Nextcloud</text>
  <text x="318" y="125" text-anchor="middle" class="sketch-text">Deck</text>

  <!-- Plus sign 2 - hand drawn -->
  <path class="sketch-line" d="M 418 96 Q 420 94, 448 97" stroke-width="3"/>
  <path class="sketch-line" d="M 432 80 Q 434 85, 433 116" stroke-width="3"/>

  <!-- Box 3: Monday UI - sketchy rectangle -->
  <path class="sketch-box" d="M 478 42 Q 475 38, 482 40 L 608 38 Q 618 42, 620 48 L 618 150 Q 615 158, 608 160 L 485 157 Q 476 154, 475 148 Z"/>
  <text x="548" y="75" text-anchor="middle" class="sketch-icon">🎨</text>
  <text x="548" y="105" text-anchor="middle" class="sketch-text">Monday.com</text>
  <text x="548" y="125" text-anchor="middle" class="sketch-text">UI dizajn</text>

  <!-- Arrow - hand drawn -->
  <path class="sketch-line" d="M 650 98 Q 660 96, 700 97 Q 710 97, 720 97" stroke-width="3"/>
  <path class="sketch-line" d="M 700 82 Q 705 90, 722 98 Q 706 106, 700 115" stroke-width="2.5"/>

  <!-- Result Box: TablesPro - sketchy rectangle, highlighted -->
  <path class="sketch-box-result" d="M 750 35 Q 746 30, 755 28 L 878 32 Q 890 36, 892 42 L 890 155 Q 886 165, 878 168 L 758 165 Q 748 160, 746 152 Z"/>
  <text x="820" y="70" text-anchor="middle" class="sketch-icon">🚀</text>
  <text x="820" y="105" text-anchor="middle" class="sketch-text-big">TablesPro</text>
  <text x="820" y="128" text-anchor="middle" class="sketch-text">CRM</text>

  <!-- Sketchy underlines/accents -->
  <path class="sketch-line" d="M 760 140 Q 780 142, 820 141 Q 860 140, 880 142" stroke-width="1.5" stroke="#0d9488" opacity="0.5"/>
</svg>