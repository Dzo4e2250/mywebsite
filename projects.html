<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekti | George Ristov</title>
    <meta name="description" content="Vsi projekti na GitHub - George Ristov">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260107b">
    <link rel="icon" type="image/png" href="logo-nobacground.png">
    <!-- Hreflang for multi-language SEO -->
    <link rel="alternate" hreflang="sl" href="https://ristov.xyz/projects.html" />
    <link rel="alternate" hreflang="en" href="https://ristov.xyz/en/projects.html" />
    <link rel="alternate" hreflang="x-default" href="https://ristov.xyz/projects.html" />
    <style>
        /* Projects Page Specific Styles */
        .projects-page-hero {
            padding: calc(var(--space-4xl) + 60px) var(--space-xl) var(--space-3xl);
            background: var(--bg-secondary);
            text-align: center;
        }

        .projects-page-hero .back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: var(--space-xl);
            transition: color var(--transition-fast);
        }

        .projects-page-hero .back-link:hover {
            color: var(--accent-primary);
        }

        .projects-page-hero .back-link svg {
            transition: transform var(--transition-fast);
        }

        .projects-page-hero .back-link:hover svg {
            transform: translateX(-4px);
        }

        .projects-page-hero h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            margin-bottom: var(--space-md);
        }

        .projects-page-hero p {
            color: var(--text-secondary);
            font-size: 1.125rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .projects-grid-section {
            padding: var(--space-3xl) var(--space-xl);
        }

        .projects-grid-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .repos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: var(--space-lg);
        }

        .repo-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-tertiary);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            display: flex;
            flex-direction: column;
            transition: all var(--transition-base);
        }

        .repo-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .repo-card-header {
            display: flex;
            align-items: flex-start;
            gap: var(--space-md);
            margin-bottom: var(--space-md);
        }

        .repo-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient-subtle);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .repo-icon svg {
            width: 20px;
            height: 20px;
            fill: var(--accent-primary);
        }

        .repo-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-xs);
            word-break: break-word;
        }

        .repo-visibility {
            display: inline-block;
            padding: 2px 8px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .repo-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
            flex-grow: 1;
            margin-bottom: var(--space-md);
        }

        .repo-meta {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-md);
            margin-bottom: var(--space-lg);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .repo-meta-item {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .repo-language-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .repo-actions {
            display: flex;
            gap: var(--space-sm);
        }

        .repo-link {
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: var(--radius-md);
            text-decoration: none;
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 500;
            transition: all var(--transition-fast);
        }

        .repo-link:hover {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: white;
        }

        .repo-link svg {
            width: 16px;
            height: 16px;
        }

        .repos-loading {
            text-align: center;
            padding: var(--space-4xl);
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .repos-loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-tertiary);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto var(--space-md);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .repos-error {
            text-align: center;
            padding: var(--space-3xl);
            background: #fef2f2;
            border-radius: var(--radius-lg);
            color: #991b1b;
            grid-column: 1 / -1;
        }

        .repos-empty {
            text-align: center;
            padding: var(--space-3xl);
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        /* Language colors */
        .lang-python { background-color: #3572A5; }
        .lang-javascript { background-color: #f1e05a; }
        .lang-typescript { background-color: #3178c6; }
        .lang-html { background-color: #e34c26; }
        .lang-css { background-color: #563d7c; }
        .lang-php { background-color: #4F5D95; }
        .lang-shell { background-color: #89e051; }
        .lang-vue { background-color: #41b883; }
        .lang-default { background-color: #6b7280; }

        /* Footer adjustment for projects page */
        .projects-page .footer {
            margin-top: 0;
        }

        @media (max-width: 768px) {
            .repos-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="projects-page">
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <a href="/" class="nav-logo">George Ristov<span class="accent">.</span></a>
            <div class="nav-links">
                <a href="/#zgodba" class="nav-link">O meni</a>
                <a href="/#projekti" class="nav-link">Projekti</a>
                <a href="/#pot" class="nav-link">Kariera</a>
                <a href="/#kontakt" class="nav-link btn-nav">Kontakt</a>
                <a href="/en/projects.html" class="nav-link lang-switch">EN</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="projects-page-hero">
        <a href="/#projekti" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Nazaj na projekte
        </a>
        <h1>Vsi projekti na GitHub</h1>
        <p>Odprtokodni projekti, eksperimenti in orodja, ki sem jih gradil.</p>
    </section>

    <!-- Projects Grid -->
    <section class="projects-grid-section">
        <div class="projects-grid-container">
            <div id="reposContainer" class="repos-grid">
                <div class="repos-loading">
                    <div class="spinner"></div>
                    <p>Nalagam repozitorije...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-left">
                <span class="footer-logo"><img src="logo-nobacground.png" alt="Logo" class="footer-logo-img">George Ristov<span class="accent">.</span></span>
                <span class="footer-tagline">Samo domišljija je lahko omejitev.</span>
            </div>
            <div class="footer-right">
                <span>2026 · Zgrajeno z AI pomočjo, ker tako delam.</span>
                <a href="#" onclick="showCookieSettings(); return false;" class="footer-cookie-link">Upravljaj piškotke</a>
            </div>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="app.js?v=20260107fix"></script>
    <script src="cookie-consent.js?v=20260118"></script>
</body>
</html>
